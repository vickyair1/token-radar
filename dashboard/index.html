<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by expected launch value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true">&#9679;</div>
    <div>
      <h1>Token Radar</h1>
      <p class="sub">Pre-token protocols, ranked by expected launch value.</p>
    </div>
  </div>
  <div class="stats" id="stats" aria-label="Board summary"></div>
</header>
<p class="formula" id="formula" aria-label="How a launch is priced"></p>
<section class="accounting" id="accounting" aria-label="What the snapshot holds"></section>
<section class="integrity" id="integrity" aria-label="Integrity checks"></section>
<section class="evidence" id="evidence" aria-label="Out-of-sample evidence"></section>
<nav class="tabs" id="tabs" aria-label="Views">
  <button data-tab="pre-token" class="active">Pre-token board</button>
  <button data-tab="live">Live tokens</button>
  <button data-tab="set-aside">Set aside</button>
  <button data-tab="model">The model</button>
  <span class="count" id="count"></span>
</nav>
<section class="controls" id="controls" aria-label="Board filters">
  <label class="search"><span class="sr">Search</span><input id="q" type="search" placeholder="Search a protocol&hellip;" autocomplete="off"></label>
  <label>Category <select id="category"><option value="all">All categories</option></select></label>
  <label>Chain <select id="chain"><option value="all">All chains</option></select></label>
  <label>Scope <select id="scope"><option value="all">All scopes</option><option value="watchlist">Watchlist</option><option value="off-list">Off-list</option><option value="early">Early</option></select></label>
  <label>Verdict <select id="verdict"><option value="all">All verdicts</option><option value="farm">Farm</option><option value="marginal">Marginal</option><option value="skip">Skip</option></select></label>
  <label>Deposit <select id="deposit"><option value="plan" selected>Plan 0.02% TVL</option><option value="100">$100</option><option value="1000">$1,000</option><option value="10000">$10,000</option></select></label>
  <label>Drop share <select id="drop"><option value="0.035">3.5%</option><option value="0.07" selected>7%</option><option value="0.14">14%</option></select></label>
</section>
<main id="board" tabindex="-1" aria-busy="true"></main>
<footer class="foot">
  <p>Data: DefiLlama snapshot, frozen <span id="asof"></span>. Implied values are a model's estimate from that snapshot, not a promise: a launch may never come, and a token may trade far from any estimate. Never pay to claim an airdrop. <span id="selfcheck"></span></p>
</footer>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
